name: Fork Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset: nsis/*.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            asset: nsis/*.exe
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            asset: dmg/*.dmg
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
            asset: dmg/*.dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
            asset: '**/*.[dr][ep][bm]'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
            asset: '**/*.[dr][ep][bm]'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.3.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled resources
        run: pnpm run prebuild ${{ matrix.target }}
      - name: Build installer
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.fork.conf.json
      - name: Verify macOS signature and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/Clash Verge.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep 'Signature=adhoc'
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          arch=arm64
          if [[ "${{ matrix.target }}" == x86_64-* ]]; then arch=x86_64; fi
          lipo -verify_arch "$arch" "$app/Contents/MacOS/$executable"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Publish fork prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          tag="fork-v${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          Personal fork build for Windows, macOS, and Linux (x64 and ARM64).

          - Preserves this fork's existing fix that stops writing 114.114.114.114 to system DNS.
          - macOS uses ad-hoc signing and is not notarized by Apple; Windows installers are unsigned.
          - In-app update endpoints are disabled. Install future releases manually from this repository.
          NOTES
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> release-notes.md
          mapfile -d '' assets < <(find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -print0)
          test "${#assets[@]}" -eq 8
          (cd installers && find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z | xargs -0 sha256sum) > installers/SHA256SUMS.txt
          gh release create "$tag" "${assets[@]}" installers/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Clash Verge ${version} — Personal Fork" \
            --notes-file release-notes.md \
            --prerelease
